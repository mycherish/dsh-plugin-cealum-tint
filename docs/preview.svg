<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <!-- Text-free: one shared artwork for every detail document locale. -->
  <rect width="640" height="300" fill="#22262B"/>
  <rect x="32" y="32" width="576" height="236" rx="20" fill="#2A2F35"/>

  <!-- Native side: the host's own user bubbles -->
  <g>
    <rect x="72" y="84" width="184" height="44" rx="14" fill="#EDF3FE"/>
    <circle cx="128" cy="106" r="5" fill="#667085"/>
    <circle cx="148" cy="106" r="5" fill="#667085"/>
    <circle cx="168" cy="106" r="5" fill="#667085"/>
    <rect x="112" y="156" width="144" height="44" rx="14" fill="#EDF3FE"/>
    <circle cx="168" cy="178" r="5" fill="#667085"/>
    <circle cx="188" cy="178" r="5" fill="#667085"/>
  </g>

  <!-- Transition arrow -->
  <g fill="none" stroke="#9AA3AD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M282 142h68"/>
    <path d="M336 126l18 16-18 16"/>
  </g>

  <!-- Tinted side: the same bubbles in deep green with white text -->
  <g>
    <rect x="384" y="84" width="184" height="44" rx="14" fill="#2C6732"/>
    <circle cx="440" cy="106" r="5" fill="#FFFFFF"/>
    <circle cx="460" cy="106" r="5" fill="#FFFFFF"/>
    <circle cx="480" cy="106" r="5" fill="#FFFFFF"/>
    <rect x="424" y="156" width="144" height="44" rx="14" fill="#2C6732"/>
    <circle cx="480" cy="178" r="5" fill="#FFFFFF"/>
    <circle cx="500" cy="178" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Swatch chips echo the plugin's presets (bottom strip) -->
  <g>
    <rect x="72" y="228" width="28" height="12" rx="6" fill="#2C6732"/>
    <rect x="108" y="228" width="28" height="12" rx="6" fill="#245B82"/>
    <rect x="144" y="228" width="28" height="12" rx="6" fill="#604B83"/>
    <rect x="180" y="228" width="28" height="12" rx="6" fill="#805B26"/>
    <rect x="216" y="228" width="28" height="12" rx="6" fill="#414141"/>
  </g>
</svg>
